<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GL2025 Travel Agency</title>
  <style>
    /* Minimal reset & layout */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background:linear-gradient(180deg,#f0f8ff,#ffffff);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:#08324a;
    }

    /* Card */
    .card{
      width:100%;
      max-width:520px;
      background:#fff;
      border-radius:16px;
      padding:28px;
      box-shadow:0 14px 40px rgba(6,30,60,0.12);
      text-align:center;
      border:1px solid rgba(8,50,74,0.04);
    }
    .logo{
      display:inline-grid;
      place-items:center;
      width:150px;height:64px;border-radius:12px;
      background:linear-gradient(135deg,#00b4d8,#0077b6);
      color:#fff;font-weight:800;font-size:18px;margin:0 auto 14px;
    }
    h1{font-size:20px;margin-bottom:8px}
    p{color:#275773;opacity:0.95;margin-bottom:18px}
    .cta{
      display:inline-block;padding:10px 16px;border-radius:10px;
      background:linear-gradient(90deg,#ff7a59,#ff4d6d);
      color:#fff;font-weight:700;text-decoration:none;
      box-shadow:0 8px 20px rgba(255,77,109,0.12);
    }
    .muted{font-size:13px;color:#6b98ac;margin-top:14px}
    @media (max-width:420px){
      .card{padding:20px}
      h1{font-size:18px}
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Welcome card">
    <div class="logo" aria-hidden="true">ToNice</div>
    <h1>Welcome to our travel agency</h1>
    <p>Personalized trips, local expertise, and curated experiences for every traveler.</p>
    <a class="cta" href="#contact">Get started</a>  
  </main>
</body>
</html>
